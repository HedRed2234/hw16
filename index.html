<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Котики 😺</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles/style.css">
</head>
<body>
  <div class="card">
    <img id="cat-photo" src="" alt="cat">
    <ul>
      <li>Порода: <span id="breed"></span></li>
      <li>Вік: <span id="age"></span></li>
      <li>Кличка: <span id="name"></span></li>
      <li>Стать: <span id="gender"></span></li>
      <li>Колір шерстки: <span id="color"></span></li>
      <li>Статус: <span id="status"></span></li>
    </ul>
    <div class="buttons" id="buttons"></div>
  </div>
  <script src="./cat.js"></script>
</body>
</html>
